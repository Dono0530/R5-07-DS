name: Q2

on:
  push:
    paths:
      - 'XYZ.txt'
      - '.github/workflows/Q2.yaml'

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Creer le rapport
        run: |
          {
            echo "Donovan Prévost"
            echo "Date et heure d'execution : $(date +'%d-%m-%Y %H:%M:%S') UTC"
            echo "Contenu de XYZ.txt :"
            cat XYZ.txt
            echo
            echo "Taille de XYZ.txt (octets) :"
            wc -c < XYZ.txt
          } > Q2_archive_XYZ.txt

      - name: Publier le rapport
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Q2_archive_XYZ.txt
          if ! git diff --cached --quiet; then
            git commit -m "Q2 : rapport de XYZ"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
