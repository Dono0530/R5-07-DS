name: Q4

on:
  push:
    paths:
      - 'Q4.java'
      - '.github/workflows/Q4.yaml'

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Creer une archive datee
        run: |
          DATE=$(date +%d-%m-%Y)
          RAPPORT="Q4_archive_${DATE}.txt"
          {
            echo "Prévost Donovan"
            echo "Source de Q4.java :"
            cat Q4.java
          } > "$RAPPORT"
          echo "RAPPORT=$RAPPORT" >> "$GITHUB_ENV"

      - name: Publier le rapport
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$RAPPORT"
          if ! git diff --cached --quiet; then
            git commit -m "Q4 : archive datee de Q4.java"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
